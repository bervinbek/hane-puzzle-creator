# Checks only. The site is NOT deployed from here: it is published from the maintainer's computer
# with `npm run deploy` (tools/deploy.mjs), which pushes the build to the `gh-pages` branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build (the same build that is published, with the Pages base path)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

  # Runs beside the checks above. It builds its own dist/ with base "/".
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: E2E smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: true
          BASE_PATH: /
