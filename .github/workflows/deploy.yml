name: CI and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build for Pages (base path = repository name)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # The class inbox (D-049). Both are public by design; set them under Settings, Secrets and
          # variables, Actions, Variables. When they are empty the site never asks for a class code
          # and never sends anything.
          VITE_INBOX_URL: ${{ vars.VITE_INBOX_URL }}
          VITE_INBOX_KEY: ${{ vars.VITE_INBOX_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # Runs beside the deploy, not before it: a red mark here warns us but does not hold the site back.
  # It builds its own dist/ with base "/", so it cannot disturb the Pages build above.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: E2E smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: true
          BASE_PATH: /

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
